name: Enhanced Windows builds
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: enhanced-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            flags: "-rel"
          - arch: arm64
            flags: "-rel -arm64"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Check build command options
        run: bun tests/build-cli.ts
      - name: Check release packaging guards
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./tests/release-packaging.ps1
      - name: Generate Windows projects
        run: bun cmd/premake.ts
      - name: Build native installer
        run: bun cmd/build.ts ${{ matrix.flags }}
      - name: Build standalone portable executable
        run: bun cmd/build.ts ${{ matrix.flags }} -static
      - name: Run native headless tests
        if: matrix.arch == 'x64'
        run: bun cmd/run-unit-tests.ts -dbg
      - name: Package installer and portable app
        shell: pwsh
        run: ./cmd/package-enhanced.ps1 -Architecture '${{ matrix.arch }}'
      - name: Check clean extraction and installation beside official SumatraPDF
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $official = Join-Path $env:RUNNER_TEMP 'SumatraPDF-3.6.1-64-install.exe'
          Invoke-WebRequest -Uri 'https://www.sumatrapdfreader.org/dl/rel/3.6.1/SumatraPDF-3.6.1-64-install.exe' -OutFile $official
          if ((Get-FileHash -LiteralPath $official).Hash -ne '1EEE71CCCD2EA6E94D5BCEA54EE2F759844DA3E1A0EE2F6045035B1D17B94381') { throw 'Official acceptance fixture checksum changed' }
          $version = (Get-Content -LiteralPath enhanced-version.txt -Raw).Trim()
          ./tests/enhanced-install-acceptance.ps1 -Installer "dist/SumatraPDF-Enhanced-$version-x64-install.exe" -PortableZip "dist/SumatraPDF-Enhanced-$version-x64-portable.zip" -OfficialInstaller $official -ReportDirectory "$env:RUNNER_TEMP/acceptance-results"
      - name: Upload installation acceptance evidence
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: acceptance-x64
          path: ${{ runner.temp }}/acceptance-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload executables and portable ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: enhanced-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*-manifest.json
            dist/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
  test:
    name: Source-matched x64 ASan and native UI tests
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Build debug ASan reader
        run: bun cmd/build.ts -asan -dbg
      - name: Run native unit tests
        run: ./out/dbg64_asan/SumatraPDF-static.exe -unit-tests -for-ai -for-testing
      - name: Run all hosted-compatible UI tests
        env:
          SUMATRA_TEST_EXE: ${{ github.workspace }}\out\dbg64_asan\SumatraPDF-static.exe
        run: bun tests/run-github-ci.ts
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-x64-asan
          path: |
            tests/tmp
            .work/test-times.txt
          if-no-files-found: ignore
          retention-days: 14
